[workspace]
resolver = "2"
members = [
    "crates/flux-core",
    "crates/flux-store",
    "crates/flux-project",
    "crates/flux-subscribe",
    "crates/flux-snapshot",
    "crates/flux-cli",
]
default-members = ["crates/flux-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/arjunnt666/flux"
authors = ["Arjun NT"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
